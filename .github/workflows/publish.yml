name: Sync school schedule and publish

on:
  push:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

concurrency:
  group: school-schedule-pages
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.sync.outputs.publish }}
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Check date and parser behavior
        run: npm test
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Import the sheet and check for changes
        id: sync
        run: npm run sync:pages
        env:
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          GOOGLE_SHEET_TAB: ${{ vars.GOOGLE_SHEET_TAB }}
          SCHOOL_YEAR_START: ${{ vars.SCHOOL_YEAR_START }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
      - name: Build static routes
        if: steps.sync.outputs.publish == 'true'
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base="$PAGES_BASE/"
      - uses: actions/upload-pages-artifact@v4
        if: steps.sync.outputs.publish == 'true'
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish the agenda
        id: publish
        uses: actions/deploy-pages@v4
